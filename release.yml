# Windows 用 EXE をビルドして GitHub Release に添付する。次のどちらでも動く。
#   1) v から始まるタグ（例: v1.3.1）を git で push したとき → Release を新しく作る
#   2) GitHub の画面で Release を公開したとき → その Release にファイルを添付し、説明を更新履歴で書き換える
# アプリはこの Release を見て「新しいバージョンがあります」と知らせる。
name: release

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]

permissions:
  contents: write

# 同じタグで2回動いても順番に処理する
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: バージョン番号を取り出す
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 更新履歴（web/changelog.json）に今回の版があるか確認
        run: |
          jq -e --arg v "$VER" 'any(.[]; .version == $v)' web/changelog.json > /dev/null \
            || { echo "::error::web/changelog.json に $VER の項目がありません"; exit 1; }

      - name: ビルド
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-H=windowsgui -s -w -X main.appVersion=$VER" \
            -o nwlog-teraterm.exe .

      - name: 配布物を作る
        run: |
          sha256sum nwlog-teraterm.exe | cut -d' ' -f1 > nwlog-teraterm.exe.sha256
          mkdir pkg
          cp nwlog-teraterm.exe "pkg/NWログ取得マクロ（TeraTerm）.exe"
          cp README.md LICENSE TERMS.md pkg/
          # 日本語のファイル名がどの展開ソフトでも化けないように作る（詳しくは mkzip.py の説明）
          python3 .github/scripts/mkzip.py "nwlog-teraterm_v$VER.zip" pkg
          # リリースノート（アプリの更新ポップアップにもこの内容が出る）
          jq -r --arg v "$VER" '.[] | select(.version == $v) | .changes[] | "- " + .' web/changelog.json > notes.md
          cat notes.md

      - name: Release を作成（すでにあればファイルを添付して説明を更新）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=("nwlog-teraterm_v$VER.zip" nwlog-teraterm.exe nwlog-teraterm.exe.sha256)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "v$VER" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "v$VER" --notes-file notes.md
          fi
